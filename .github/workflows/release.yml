name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl linker
        if: endsWith(matrix.target, 'linux-musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --locked
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          target="${{ matrix.target }}"
          bin="target/${target}/release/browse"
          test -f "$bin"
          stage="$(mktemp -d)"
          cp "$bin" "${stage}/browse"
          chmod 755 "${stage}/browse"
          asset="browse-${ver}-${target}.tar.gz"
          tar -c -z -f "$asset" -C "$stage" browse
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi
          mkdir -p dist
          mv "$asset" "${asset}.sha256" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: SHA256SUMS and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'browse-*.tar.gz' -exec cp {} dist/ \;
          : > dist/SHA256SUMS
          for f in dist/browse-*.tar.gz; do
            base=$(basename "$f")
            sum=$(find artifacts -type f -name "${base}.sha256" | head -n 1)
            if [ -n "$sum" ]; then
              # normalize to "hex  filename"
              awk -v n="$base" '{print $1 "  " n}' "$sum" >> dist/SHA256SUMS
            else
              sha256sum "$f" | awk -v n="$base" '{print $1 "  " n}' >> dist/SHA256SUMS
            fi
          done
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/browse-*.tar.gz dist/SHA256SUMS
